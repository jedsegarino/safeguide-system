<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register – SafeGuide</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <main class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="#0f9d58"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Zm4 10h-3v3h-2v-3H8v-2h3V7h2v3h3v2Z"/></svg>
        SafeGuide
      </div>
      <h1>Create your account</h1>
      <p class="sub">Register to open your dashboard.</p>

      <div id="msg" class="alert hidden" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="field"><label for="full_name">Full Name</label><input id="full_name" name="full_name" placeholder="Enter your full name" autocomplete="name" required></div>
        <div class="field"><label for="username">Username</label><input id="username" name="username" placeholder="Choose a username" autocomplete="username" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required></div>
        <div class="field"><label for="confirm_password">Confirm Password</label><input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm your password" autocomplete="new-password" required></div>
        <button class="btn btn-block" type="submit">Register</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
